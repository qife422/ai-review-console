name: Langflow migration and checkpoint rollback (isolated)

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Native Linux architecture
        type: choice
        options: [amd64, arm64]
        default: amd64
        required: true

permissions:
  contents: read

jobs:
  migration:
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 90
    env:
      COMPOSE_BAKE: "false"
      ARC_MIGRATION_ARCH: ${{ inputs.architecture }}
      ARC_MIGRATION_RUNNER_ARCH: ${{ runner.arch }}
      POSTGRES_PASSWORD: synthetic-migration-postgres-only
      LANGFLOW_SUPERUSER: synthetic-migration-admin
      LANGFLOW_SUPERUSER_PASSWORD: synthetic-migration-password-only
      LANGFLOW_SECRET_KEY: synthetic-migration-shared-secret-only
      REVIEW_SERVICE_TOKEN: synthetic-migration-service-token-only
      LANGFLOW_URL: http://127.0.0.1:7860
    steps:
      - uses: actions/checkout@v4
      - name: Require fresh run namespaces and 30 GiB before builds
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTIONS" == true && "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]]
          case "$ARC_MIGRATION_ARCH:$ARC_MIGRATION_RUNNER_ARCH:$(uname -s):$(uname -m)" in
            amd64:X64:Linux:x86_64|arm64:ARM64:Linux:aarch64) ;;
            *) echo 'Host or runner architecture mismatch' >&2; exit 1 ;;
          esac
          test "$(df -B1 --output=avail /tmp | tail -n 1 | tr -d '[:space:]')" -ge 32212254720
          arc_root="$(mktemp -d "/tmp/arc-migration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")"
          mkdir "$arc_root/meta"
          echo "ARC_MIGRATION_ROOT=$arc_root" >> "$GITHUB_ENV"
          echo "ARC_MIGRATION_META=$arc_root/meta" >> "$GITHUB_ENV"
          echo "ARC_MIGRATION_BASELINE_IMAGE=arc-migration-langflow-baseline:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "ARC_MIGRATION_CANDIDATE_IMAGE=arc-migration-langflow-candidate:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "ARC_MIGRATION_API_IMAGE=arc-migration-api:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "ARC_MIGRATION_WEB_IMAGE=arc-migration-web:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          cat > "$arc_root/shell" <<'SH'
          set -euo pipefail
          arc_migration_guard() {
            local available
            available="$(df -B1 --output=avail /tmp | tail -n 1 | tr -d '[:space:]')"
            printf '{"available_bytes":%s,"floor_bytes":5368709120}\n' "$available" >> "$ARC_MIGRATION_META/capacity.jsonl"
            test "$available" -ge 5368709120
          }
          arc_migration_bounded_run() {
            arc_migration_guard
            "$@" &
            local command_pid=$!
            while kill -0 "$command_pid" 2>/dev/null; do
              if ! arc_migration_guard; then
                kill "$command_pid" 2>/dev/null || true
                wait "$command_pid" || true
                echo 'Runner capacity floor reached; command stopped without cleanup.' >&2
                return 1
              fi
              sleep 5
            done
            wait "$command_pid"
            arc_migration_guard
          }
          arc_migration_phase() {
            case "$1" in baseline|upgrade|rollback) ;; *) return 1 ;; esac
            export ARC_MIGRATION_PROJECT="arc-migration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$1"
            export ARC_MIGRATION_LANGFLOW_IMAGE="$ARC_MIGRATION_BASELINE_IMAGE"
            export ARC_MIGRATION_DATABASE_SCHEME=postgresql
            if [[ "$1" == upgrade ]]; then
              export ARC_MIGRATION_LANGFLOW_IMAGE="$ARC_MIGRATION_CANDIDATE_IMAGE"
              export ARC_MIGRATION_DATABASE_SCHEME=postgresql+psycopg
            fi
          }
          arc_migration_compose() {
            arc_migration_bounded_run timeout 1200s docker compose -p "$ARC_MIGRATION_PROJECT" -f "$GITHUB_WORKSPACE/docker/compose.migration.yml" "$@"
          }
          arc_migration_require_absent() {
            python - <<'PY'
          import json, os, subprocess
          project = os.environ['ARC_MIGRATION_PROJECT']
          for kind, args in (
              ('container', ['docker','ps','-a','--format','{{json .}}']),
              ('volume', ['docker','volume','ls','--format','{{json .}}']),
              ('network', ['docker','network','ls','--format','{{json .}}']),
          ):
              items = subprocess.check_output(args, text=True).splitlines()
              for line in items:
                  item = json.loads(line)
                  name = item.get('Names', item.get('Name', ''))
                  labels = item.get('Labels') or ''
                  if name == project or name.startswith(project + '-') or name.startswith(project + '_') or 'com.docker.compose.project=' + project in labels:
                      raise SystemExit('Refusing existing isolated ' + kind + ' namespace')
          PY
          }
          arc_migration_verify() {
            arc_migration_bounded_run timeout 1200s .venv/bin/python scripts/verify_langflow_migration.py "$1" \
              --project "$ARC_MIGRATION_PROJECT" --compose-file docker/compose.migration.yml \
              --checkpoint-dir "$ARC_MIGRATION_ROOT/checkpoint" \
              --api-url http://127.0.0.1:8080 --evidence "$ARC_MIGRATION_META/$2.json"
          }
          SH
          echo "BASH_ENV=$arc_root/shell" >> "$GITHUB_ENV"
          export ARC_MIGRATION_ROOT="$arc_root" ARC_MIGRATION_META="$arc_root/meta"
          source "$arc_root/shell"
          arc_daemon_arch="$(arc_migration_bounded_run timeout 30s docker info --format '{{.OSType}} {{.Architecture}}')"
          case "$ARC_MIGRATION_ARCH:$arc_daemon_arch" in
            amd64:'linux x86_64'|amd64:'linux amd64'|arm64:'linux aarch64'|arm64:'linux arm64') ;;
            *) echo 'Docker daemon platform mismatch' >&2; exit 1 ;;
          esac
          for phase in baseline upgrade rollback; do
            export ARC_MIGRATION_PROJECT="arc-migration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$phase"
            arc_migration_require_absent
          done
          arc_migration_guard
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install bounded verification dependencies and build Web assets
        run: |
          arc_migration_guard
          python -m venv .venv
          # This is the existing API/helper dependency lock, not the candidate's
          # Langflow environment. All candidate packages live in its image.
          arc_migration_bounded_run timeout 600s .venv/bin/pip install --no-cache-dir -r requirements.lock
          arc_migration_bounded_run timeout 180s .venv/bin/pip install --no-cache-dir --no-deps -e .
          arc_migration_bounded_run timeout 600s npm --prefix frontend ci --cache "$ARC_MIGRATION_ROOT/npm-cache"
          arc_migration_bounded_run timeout 180s npm --prefix frontend run build
          arc_migration_guard
      - name: Build isolated API, Web, unchanged 1.11.6 and locked 1.13.1 images
        run: |
          arc_migration_guard
          arc_migration_bounded_run timeout 1200s docker build -f docker/api.Dockerfile -t "$ARC_MIGRATION_API_IMAGE" .
          arc_migration_guard
          arc_migration_bounded_run timeout 600s docker build -f docker/web.Dockerfile -t "$ARC_MIGRATION_WEB_IMAGE" .
          arc_migration_guard
          arc_migration_bounded_run timeout 1800s docker build -f docker/langflow.Dockerfile -t "$ARC_MIGRATION_BASELINE_IMAGE" .
          arc_migration_guard
          arc_migration_bounded_run timeout 1200s docker build -f docker/langflow-candidate.Dockerfile -t "$ARC_MIGRATION_CANDIDATE_IMAGE" .
          arc_migration_guard
      - name: Verify native Docker and all migration image architectures
        run: |
          set -euo pipefail
          arc_migration_guard
          arc_daemon_arch="$(arc_migration_bounded_run timeout 30s docker info --format '{{.OSType}} {{.Architecture}}')"
          case "$ARC_MIGRATION_ARCH:$arc_daemon_arch" in
            amd64:'linux x86_64'|amd64:'linux amd64'|arm64:'linux aarch64'|arm64:'linux arm64') ;;
            *) echo 'Docker daemon platform mismatch' >&2; exit 1 ;;
          esac
          arc_migration_phase baseline
          arc_pg="$(arc_migration_bounded_run timeout 60s docker compose -p "$ARC_MIGRATION_PROJECT" -f "$GITHUB_WORKSPACE/docker/compose.migration.yml" config --format json | python -c 'import json,sys; print(json.load(sys.stdin)["services"]["postgres"]["image"])')"
          [[ "$arc_pg" =~ ^postgres:16\.15-trixie@sha256:[0-9a-f]{64}$ ]] || { echo 'Unexpected Postgres pin' >&2; exit 1; }
          arc_migration_bounded_run timeout 600s docker pull "$arc_pg" >/dev/null
          arc_records="$ARC_MIGRATION_ROOT/image-platforms.txt"
          : > "$arc_records"
          for arc_image in "$ARC_MIGRATION_BASELINE_IMAGE" "$ARC_MIGRATION_CANDIDATE_IMAGE" "$ARC_MIGRATION_API_IMAGE" "$ARC_MIGRATION_WEB_IMAGE" "$arc_pg"; do
            arc_migration_bounded_run timeout 30s docker image inspect --format '{{.Id}} {{.Os}} {{.Architecture}}' "$arc_image" >> "$arc_records"
          done
          export ARC_MIGRATION_DOCKER_PLATFORM="$arc_daemon_arch" ARC_MIGRATION_POSTGRES_IMAGE="$arc_pg"
          python - <<'PY'
          import json, os, pathlib, platform, re
          root = pathlib.Path(os.environ['ARC_MIGRATION_ROOT'])
          arch = os.environ['ARC_MIGRATION_ARCH']
          names = ('baseline','candidate','api','web','postgres')
          rows = (root/'image-platforms.txt').read_text().splitlines()
          if len(rows) != len(names):
              raise SystemExit('Expected exactly five platform records')
          images = {}
          for name, row in zip(names, rows, strict=True):
              fields = row.split()
              if len(fields) != 3 or not re.fullmatch(r'sha256:[0-9a-f]{64}', fields[0]) or fields[1:] != ['linux', arch]:
                  raise SystemExit('Image platform or immutable ID mismatch: ' + name)
              images[name] = {'image_id':fields[0], 'os':fields[1], 'architecture':fields[2]}
          evidence = {'requested':arch, 'host_system':platform.system(), 'host_machine':platform.machine(),
                      'runner_arch':os.environ['ARC_MIGRATION_RUNNER_ARCH'],
                      'docker_platform':os.environ['ARC_MIGRATION_DOCKER_PLATFORM'],
                      'postgres_reference':os.environ['ARC_MIGRATION_POSTGRES_IMAGE'], 'images':images}
          with (pathlib.Path(os.environ['ARC_MIGRATION_META'])/'architecture.json').open('x') as stream:
              json.dump(evidence, stream, indent=2); stream.write('\n')
          PY
          arc_migration_guard
      - name: Create only the fresh baseline and exercise five synthetic cases
        run: |
          arc_migration_guard
          arc_migration_phase baseline
          arc_migration_require_absent
          arc_migration_compose config --quiet
          arc_migration_compose up -d --no-build --wait --wait-timeout 180 postgres
          arc_migration_compose run -T --no-deps storage-init
          arc_migration_compose run -T --no-deps migrate
          arc_migration_compose up -d --no-build --wait --wait-timeout 900 langflow
          arc_migration_compose run -T --no-deps flow-init
          arc_migration_compose up -d --no-build --wait --wait-timeout 180 api worker web
          timeout 120s sh -c 'until curl -fsS http://127.0.0.1:8080/api/health >/dev/null; do sleep 2; done'
          arc_migration_bounded_run timeout 1200s .venv/bin/python scripts/validate_langflow.py --expected-langflow-version 1.11.6 \
            --api-url http://127.0.0.1:8080 --evidence "$ARC_MIGRATION_META/baseline-validation.json" >/dev/null
          arc_migration_guard
      - name: Quiesce baseline and create the bounded pre-upgrade checkpoint
        run: |
          arc_migration_phase baseline
          arc_migration_guard
          arc_migration_verify checkpoint checkpoint-summary
          cp --no-clobber "$ARC_MIGRATION_ROOT/checkpoint/checkpoint.json" "$ARC_MIGRATION_META/checkpoint-manifest.json"
          arc_migration_compose stop
          arc_migration_guard
      - name: Restore the same checkpoint to a new empty 1.13.1 namespace
        run: |
          arc_migration_phase upgrade
          arc_migration_guard
          arc_migration_require_absent
          arc_migration_compose up -d --no-build --wait --wait-timeout 180 postgres
          arc_migration_compose run -T --no-deps storage-init
          arc_migration_verify restore upgrade-restore
          # Starting Langflow performs its own schema migration. No flow-init,
          # bootstrap, application migrate or stored-graph PATCH is allowed here.
          arc_migration_compose up -d --no-build --wait --wait-timeout 900 langflow
          arc_migration_compose up -d --no-build --wait --wait-timeout 180 api worker web
          timeout 120s sh -c 'until curl -fsS http://127.0.0.1:8080/api/health >/dev/null; do sleep 2; done'
          arc_migration_verify verify upgrade-summary
          arc_migration_compose stop
          arc_migration_guard
      - name: Restore the pre-upgrade checkpoint to a third empty 1.11.6 namespace
        run: |
          arc_migration_phase rollback
          arc_migration_guard
          arc_migration_require_absent
          arc_migration_compose up -d --no-build --wait --wait-timeout 180 postgres
          arc_migration_compose run -T --no-deps storage-init
          arc_migration_verify restore rollback-restore
          arc_migration_compose up -d --no-build --wait --wait-timeout 900 langflow
          arc_migration_compose up -d --no-build --wait --wait-timeout 180 api worker web
          timeout 120s sh -c 'until curl -fsS http://127.0.0.1:8080/api/health >/dev/null; do sleep 2; done'
          arc_migration_verify verify rollback-summary
          arc_migration_compose stop
          arc_migration_guard
      - name: Write only selected evidence identities and limits
        id: evidence_manifest
        if: always() && env.ARC_MIGRATION_META != ''
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          from datetime import UTC, datetime
          meta = pathlib.Path(os.environ['ARC_MIGRATION_META'])
          selected = ('capacity.jsonl','architecture.json','baseline-validation.json','checkpoint-manifest.json',
                      'checkpoint-summary.json','upgrade-restore.json','upgrade-summary.json',
                      'rollback-restore.json','rollback-summary.json')
          files = []
          for name in selected:
              path = meta / name
              if path.is_file():
                  if path.stat().st_size > 262144:
                      raise SystemExit('Selected evidence file exceeds 256 KiB')
                  files.append({'path':name,'bytes':path.stat().st_size,
                                'sha256':hashlib.sha256(path.read_bytes()).hexdigest()})
          if sum(item['bytes'] for item in files) > 1048576 or len(files) > 20:
              raise SystemExit('Selected evidence exceeds 1 MiB / 20 files')
          sources = ['docker/compose.migration.yml','.github/workflows/langflow-migration.yml',
                     'scripts/verify_langflow_migration.py','scripts/validate_langflow.py',
                     'scripts/bootstrap_langflow.py','api/app/langflow_client.py',
                     'docker/langflow.Dockerfile','docker/langflow-candidate.Dockerfile',
                     'docker/api.Dockerfile','docker/web.Dockerfile','docker/postgres-init.sql',
                     'requirements.lock','frontend/package-lock.json',
                     'compliance/langflow-candidate.lock','compliance/langflow-candidate-arm64.lock',
                     'compliance/langflow-candidate-build-tools.lock',
                     'compliance/langflow-candidate-build-tools-arm64.lock']
          images = {}
          for variable in ('ARC_MIGRATION_BASELINE_IMAGE','ARC_MIGRATION_CANDIDATE_IMAGE',
                           'ARC_MIGRATION_API_IMAGE','ARC_MIGRATION_WEB_IMAGE'):
              image = os.environ.get(variable)
              result = subprocess.run(['docker','image','inspect','--format','{{.Id}}',image],
                                      capture_output=True, text=True)
              images[variable] = result.stdout.strip() if result.returncode == 0 else None
          phase_results = {phase: json.loads((meta/(phase+'-summary.json')).read_bytes()).get('result')
                           if (meta/(phase+'-summary.json')).is_file() else None
                           for phase in ('checkpoint','upgrade','rollback')}
          manifest = {'checked_at':datetime.now(UTC).isoformat(),'phase_results':phase_results,
                      'source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
                      'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'files':files,'images':images,
                      'architecture':json.loads((meta/'architecture.json').read_bytes())
                                     if (meta/'architecture.json').is_file() else None,
                      'selected_platform_locks':(
                          ['compliance/langflow-candidate-arm64.lock',
                           'compliance/langflow-candidate-build-tools-arm64.lock']
                          if os.environ['ARC_MIGRATION_ARCH'] == 'arm64' else
                          ['compliance/langflow-candidate.lock',
                           'compliance/langflow-candidate-build-tools.lock']),
                      'sources':{name:hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
                                 for name in sources},
                      'method':'synthetic baseline checkpoint; fresh upgrade; third fresh old-version restore',
                      'not_tested':['original SQLite/historical volumes','in-place downgrade',
                                    'zero loss of post-checkpoint writes','production migration','Mac host'],
                      'unselected':'plain dumps and file copies remain ephemeral on this runner; not uploaded',
                      'limits':{'dump_bytes_each':8388608,'dump_total_bytes':33554432,
                                'checkpoint_files':100,'checkpoint_file_bytes':33554432,
                                'selected_bytes':1048576,'selected_files':20}}
          payload = json.dumps(manifest,ensure_ascii=False,indent=2).encode()
          if len(payload) > 262144 or sum(item['bytes'] for item in files) + len(payload) > 1048576 or len(files) + 1 > 20:
              raise SystemExit('Final selected evidence manifest exceeds bound')
          with (meta/'manifest.json').open('xb') as stream:
              stream.write(payload)
          PY
      - name: Stop only containers bearing this run's exact project labels
        if: always() && env.ARC_MIGRATION_ROOT != ''
        run: |
          python - <<'PY'
          import os, subprocess
          for phase in ('baseline','upgrade','rollback'):
              project = 'arc-migration-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '-' + phase
              ids = subprocess.check_output(['docker','ps','-q','--filter',
                                             'label=com.docker.compose.project=' + project], text=True).split()
              for identity in ids:
                  label = subprocess.check_output(['docker','inspect','--format',
                      '{{index .Config.Labels "com.docker.compose.project"}}', identity],text=True).strip()
                  if label != project:
                      raise SystemExit('Container ownership changed; refusing stop')
                  subprocess.run(['docker','stop',identity],check=True,stdout=subprocess.DEVNULL)
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.evidence_manifest.outcome == 'success'
        with:
          name: langflow-migration-selected-evidence
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ env.ARC_MIGRATION_META }}/manifest.json
            ${{ env.ARC_MIGRATION_META }}/capacity.jsonl
            ${{ env.ARC_MIGRATION_META }}/architecture.json
            ${{ env.ARC_MIGRATION_META }}/baseline-validation.json
            ${{ env.ARC_MIGRATION_META }}/checkpoint-manifest.json
            ${{ env.ARC_MIGRATION_META }}/checkpoint-summary.json
            ${{ env.ARC_MIGRATION_META }}/upgrade-restore.json
            ${{ env.ARC_MIGRATION_META }}/upgrade-summary.json
            ${{ env.ARC_MIGRATION_META }}/rollback-restore.json
            ${{ env.ARC_MIGRATION_META }}/rollback-summary.json
